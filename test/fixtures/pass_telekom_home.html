<!--
  Trimmed-down, synthetic stand-in for https://pass.telekom.de/home.
  Reproduces just the markup fetch_telekom_usage() parses; all figures
  below are made up, not a real subscriber's usage data.
-->
<!DOCTYPE html>
<html lang="de">
<head><title>Datennutzung</title></head>
<body class="mainContent">
    <div class="data-pass-instance" id="summationPass">
        <div class="volume fit-text-to-container">
            <div class="remaining-volume">
                <div class="remaining-volume-value">12,34
                </div>
                <div class="volume-delimiter">/</div>
            </div>
            <div class="start-volume">50</div>
            <div class="volume-unit">GB</div>
        </div>
        <div class="volume-bar-container">
            <span class="volume-bar " style="--to-width:75%;"></span>
        </div>
    </div>
    <div class="data-pass-instance" id="pass-example0001">
        <div class="data-pass-instance__headline">
            <h2>Inklusivvolumen (Inland und EU)</h2>
        </div>
        <div class="remaining-duration fit-text-to-container ">verbleibend für <span class="countdown"><span class="daysText"><span class="days">5</span> Tage </span><span class="hoursText"><span class="hours">3</span> Std. </span><span class="minutesText"><span class="mins">20</span> Min. </span><span class="secondsText"><span class="secs">10</span> Sek.</span></span>
        </div>
    </div>
</body>
</html>
